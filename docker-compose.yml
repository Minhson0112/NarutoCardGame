# docker-compose.yml - Naruto Card Game Bot

services:
  bot:
    build: .
    container_name: naruto-bot
    env_file: .env # Load môi trường từ .env file
    depends_on:
      mysql:
        condition: service_healthy # Bot sẽ chỉ khởi động sau khi MySQL báo "healthy"
    restart: unless-stopped
    volumes:
      - .:/app # Gắn mã nguồn vào container để dễ phát triển (Sync code realtime)
      - /app/__pycache__ # Ngăn ghi ngược cache từ container ra máy thật
    environment:
      - PYTHONUNBUFFERED=1

  mysql:
    image: mysql:8.0
    container_name: naruto-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: naruto_card_game
      MYSQL_USER: naruto
      MYSQL_PASSWORD: naruto
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # Thêm Healthcheck để đảm bảo bot không bị crash khi MySQL đang khởi tạo
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data: # Lưu trữ dữ liệu MySQL bền vững (không mất khi xóa container)
